[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false
repository = "https://github.com/Ambient-Computer/woodland"

[workspace.dependencies]
blake3 = { version = "1.8.7", default-features = false }
signature = "3.0.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
let_underscore_drop = "deny"
elided_lifetimes_in_paths = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
non_ascii_idents = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# Lints from `restriction`. The group as a whole contains contradictions.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
unused_result_ok = "deny"
exit = "deny"
mem_forget = "deny"
print_stdout = "deny"
print_stderr = "deny"

# Unactionable: transitive dep trees routinely contain duplicate versions.
multiple_crate_versions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev.package."*"]
opt-level = 3
