[package]
name = "woodland"
description = "A replicated database for devices that are mostly offline."
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/Ambient-Computer/woodland"

[dependencies]
blake3 = "1.8.7"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "3.0.0", features = ["batch", "serde"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
redb = { version = "4.2.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
tracing = "0.1.44"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }

# What the browser's store is reached through.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3.106", optional = true }
wasm-bindgen = { version = "0.2.129", optional = true }
web-sys = { version = "0.3.106", optional = true, features = [
  "DomException",
  "IdbCursor",
  "IdbCursorDirection",
  "IdbCursorWithValue",
  "IdbDatabase",
  "IdbFactory",
  "IdbKeyRange",
  "IdbObjectStore",
  "IdbOpenDbRequest",
  "IdbRequest",
  "IdbTransaction",
  "IdbTransactionMode",
] }

[features]
# A store kept in the browser's database, for anywhere with IndexedDB.
browser = ["dep:js-sys", "dep:wasm-bindgen", "dep:web-sys"]
# A store kept in one file, for anywhere with a filesystem.
file = ["dep:redb"]

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
let_underscore_drop = "deny"
elided_lifetimes_in_paths = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
non_ascii_idents = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# Lints from `restriction`. The group as a whole contains contradictions.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
unused_result_ok = "deny"
exit = "deny"
mem_forget = "deny"
print_stdout = "deny"
print_stderr = "deny"

# Unactionable: transitive dep trees routinely contain duplicate versions.
multiple_crate_versions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev.package."*"]
opt-level = 3

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
js-sys = "0.3.106"
wasm-bindgen-futures = "0.4.79"
wasm-bindgen-test = "0.3.79"

# A browser has neither processes nor folders.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
